        var monthNum = parseInt(prompt("Enter the month number: "));

        switch (monthNum) {
            case 1:
                alert("You entered January.")
                break;
            case 2:
                alert("You entered February.")
                break;
            case 3:
                alert("You entered March.")
                break;
            case 4:
                alert("You entered April.")
                break;
            case 5:
                alert("You entered May.")
                break;
            case 6:
                alert("You entered June.")
                break;
            case 7:
                alert("You entered July.")
                break;
            case 8:
                alert("You entered August.")
                break;
            case 9:
                alert("You entered September.")
                break;
            case 10:
                alert("You entered October.")
                break;
            case 11:
                alert("You entered November.")
                break;
            case 12:
                alert("You entered December.")
                break;
            default:
                alert("Unknown month number.")
                break;
        }
    </script>
